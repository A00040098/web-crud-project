<!DOCTYPE html>
<html>

</head>
<body onload="loadProducts()">

<nav>

</nav>

<div class="container">
  <div class="card">
    <h2>Products</h2>

    <input id="search" placeholder="Search..." onkeyup="loadProducts()">

    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/supabaseClient.js"></script>
